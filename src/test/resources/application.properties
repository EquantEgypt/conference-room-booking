# H2 Database settings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Defer JPA initialization so Flyway runs first and creates tables before Hibernate validates
#spring.jpa.defer-datasource-initialization=true
# Disable Hibernate automatic DDL/validation in tests to avoid startup failure during migrations
spring.jpa.hibernate.ddl-auto=none
#spring.flyway.enabled=true
# Run test-only migrations (H2-compatible) to avoid MySQL-specific statements in main migrations
spring.flyway.locations=classpath:db/testData
# Point Flyway to the same datasource
#spring.flyway.url=${spring.datasource.url}
#spring.flyway.user=${spring.datasource.username}
#spring.flyway.password=${spring.datasource.password}
#spring.flyway.baseline-on-migrate=true
# Diagnostic logging to verify Flyway startup & migrations
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework=INFO
