# H2 Database settings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# Disable Hibernate automatic DDL/validation in tests to avoid startup failure during migrations
spring.jpa.hibernate.ddl-auto=none

# Run test-only migrations (H2-compatible) to avoid MySQL-specific statements in main migrations
spring.flyway.locations=classpath:db/testData


# Diagnostic logging to verify Flyway startup & migrations
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework=INFO




